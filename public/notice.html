    <script>
        // 👇 이 부분이 빠져있었습니다! 새로 추가해 주세요.
        const SUPABASE_URL = 'https://jxwhdiwwgtnyyqenkpvw.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4d2hkaXd3Z3RueXlxZW5rcHZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDQ3NjgsImV4cCI6MjEwMTU4MDc2OH0.e76mCgwu-v8W-cuu3fR4_4jQ9gwP60MCCESzAgoBQaU';
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


        // 🌟 1. 통합 로그인 세션 확인 (주인장/admin 자동 감지)
        async function checkAdminSession() {
            if (!window.supabaseClient) return;
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            
            // 세션이 존재하고, 메타데이터가 있는 경우
            if (session && session.user.user_metadata) {
                const nickname = session.user.user_metadata.nickname;
                const customId = session.user.user_metadata.custom_id;
                
                // 💡 아이디가 admin이거나 닉네임이 주인장일 때만 관리자 모드 ON
                isAdminMode = (nickname === '주인장' || customId === 'admin');
            } else {
                isAdminMode = false;
            }

            // (선택) 기존에 HTML에 남아있던 관리자 전용 로그인 박스는 숨김 처리
            const adminLoginBox = document.getElementById('admin-login-box');
            const adminLogoutBox = document.getElementById('admin-logout-box');
            if (adminLoginBox) adminLoginBox.style.display = 'none';
            if (adminLogoutBox) adminLogoutBox.style.display = 'none';
        }

        // 🌟 2. 강력한 통합 로그아웃 함수 (모든 페이지 공통 적용)
        window.userLogout = async function() {
            if (!confirm("로그아웃 하시겠습니까?")) return;

            // Supabase 로그아웃 처리
            await window.supabaseClient.auth.signOut(); 
            
            // 브라우저에 남아있는 로그인 캐시 데이터 완벽 삭제
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('sb-')) { 
                    localStorage.removeItem(key);
                }
            });
            
            alert("안전하게 로그아웃 되었습니다."); 
            
            // 캐시 충돌을 막기 위해 메인 홈페이지로 강제 이동 및 새로고침
            window.location.href = 'index.html';
        };

        // 🌟 수정됨: 새 'notices' 테이블에서 불러오기
        // 🌟 수정됨: 주소창의 ID를 읽어서 해당 공지사항 자동 열기 기능 추가
        async function loadNotices() {
            const accordion = document.getElementById('notice-accordion');
            
            // 1. 주소창에서 넘어온 id 값 확인하기
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id'); 
            
            const { data, error } = await supabaseClient.from('notices')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) { accordion.innerHTML = '<div style="padding: 20px; text-align: center; color: red;">불러오기 실패</div>'; return; }
            
            if (!data || data.length === 0) {
                accordion.innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">등록된 공지사항이 없습니다.</div>';
                return;
            }

            accordion.innerHTML = '';
            
            data.forEach(notice => {
                const dateStr = notice.created_at.split('T')[0].replace(/-/g, '.');
                let deleteBtnHtml = isAdminMode ? 
                    `<button style="background:#f44336; color:white; border:none; padding:4px 8px; border-radius:4px; margin-left:10px; font-size:11px; font-weight:bold; cursor:pointer;" onclick="deleteNotice(event, ${notice.id})">삭제</button>` : '';

                // 2. 현재 그리는 공지사항이 주소창에서 넘어온 타겟 id와 같은지 확인
                const isTarget = (targetId && targetId == notice.id);
                
                // 3. 맞다면 active 클래스와 display:block을 줘서 자동으로 펼쳐지게 함
                accordion.innerHTML += `
                <div class="accordion-item" id="notice-${notice.id}">
                    <div class="accordion-header ${isTarget ? 'active' : ''}" onclick="toggleAccordion(this)">
                        <div class="accordion-title"><span class="notice-badge">공지</span> ${notice.title} ${deleteBtnHtml}</div>
                        <span class="accordion-date">${dateStr}</span>
                    </div>
                    <div class="accordion-content" style="display: ${isTarget ? 'block' : 'none'};">${notice.content.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
                </div>
                `;
            });

            // 4. 클릭해서 넘어온 글이 있다면 화면 스크롤을 그 위치로 부드럽게 이동시킴
            if (targetId) {
                setTimeout(() => {
                    const targetElement = document.getElementById(`notice-${targetId}`);
                    if (targetElement) {
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100); // 렌더링 후 약간의 시차를 두고 스크롤 이동
            }
        }

        // 🌟 수정됨: 새 'notices' 테이블에 등록 (불필요한 카테고리, 작성자 등 제외)
        async function insertNotice() {
            if (!isAdminMode) return;
            const title = document.getElementById('notice-title').value.trim();
            const content = document.getElementById('notice-content').value.trim();
            
            if (!title || !content) { alert('제목과 내용을 모두 입력하세요.'); return; }

            const { error } = await supabaseClient.from('notices').insert([{
                title: title, content: content
            }]);
            
            if (error) { alert('등록 실패: ' + error.message); return; }
            
            alert('공지사항이 성공적으로 등록되었습니다.');
            document.getElementById('notice-title').value = '';
            document.getElementById('notice-content').value = '';
            document.getElementById('notice-write-area').style.display = 'none';
            loadNotices();
        }

        // 🌟 수정됨: 새 'notices' 테이블에서 삭제 (댓글 관련 로직 불필요)
        async function deleteNotice(event, id) {
            event.stopPropagation();
            if (!isAdminMode) return;
            if (!confirm("정말 이 공지사항을 삭제하시겠습니까?")) return;
            
            const { error } = await supabaseClient.from('notices').delete().eq('id', id);
            
            if (error) alert("삭제 실패: " + error.message);
            else { alert("삭제되었습니다."); loadNotices(); }
        }

        function toggleAccordion(headerElement) {
            const content = headerElement.nextElementSibling;
            const isActive = headerElement.classList.contains('active');

            document.querySelectorAll('.accordion-header').forEach(el => {
                el.classList.remove('active');
                el.nextElementSibling.style.display = 'none';
            });

            if (!isActive) {
                headerElement.classList.add('active');
                content.style.display = 'block';
            }
        }

        async function initNotice() {
            await checkAdminSession();
            await loadNotices();
            await loadSidebarNotices();
        }
        initNotice();
    </script>
